plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.quelquechoseenplus.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.quelquechoseenplus.app'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '3.2'
    }

    // Clé de signature fixe : chaque nouvelle version s'installe par-dessus la précédente.
    signingConfigs {
        fixe {
            storeFile file('../signing/heureux-qui-communique.keystore')
            storePassword 'hqc-educs-cles'
            keyAlias 'hqc'
            keyPassword 'hqc-educs-cles'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixe
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
