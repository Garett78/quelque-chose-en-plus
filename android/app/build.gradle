plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.quelquechoseenplus.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.quelquechoseenplus.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
